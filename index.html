<!doctype html>
<html lang="es">
<head>
<title>Pesos CrossFit</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F26A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pesos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: una pantalla de gimnasio. Cabecera fija con la fecha, lista central, barra de acciones (cámara + añadir) y pestañas abajo.
   Paleta tomada de los discos de competición: azul (acento), verde (sube), rojo (baja). */
:root {
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --ink: #12161B;
  --muted: #5B6672;
  --line: #D8DDE3;
  --chip: #E2E6EB;
  --accent: #CC5206;
  --accent-ink: #FFFFFF;
  --up: #14803C;
  --down: #C62828;
  --flat: #6F7A86;
  --scrim: rgba(10, 14, 20, .55);
  --toast-link: #FFB27A;
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1014; --surface: #171B21; --ink: #EDF0F3; --muted: #9AA4AF; --line: #272D35; --chip: #232932;
    --accent: #FF8A3D; --accent-ink: #1A0A00; --up: #45C47C; --down: #FF6E66; --flat: #8A95A1; --scrim: rgba(0,0,0,.65); --toast-link: #B84A00;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1014; --surface: #171B21; --ink: #EDF0F3; --muted: #9AA4AF; --line: #272D35; --chip: #232932;
  --accent: #FF8A3D; --accent-ink: #1A0A00; --up: #45C47C; --down: #FF6E66; --flat: #8A95A1; --scrim: rgba(0,0,0,.65); --toast-link: #B84A00;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.35 var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 8px; min-height: 64px; padding-block: 8px; }
.top h1 { flex: 1; min-width: 0; margin: 0; font: 700 30px/1 var(--f-display); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1 small { display: block; font: 500 12px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.ib { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 12px; background: var(--chip); color: var(--ink); flex: none; }
.ib svg { width: 22px; height: 22px; }
.ib input[type="date"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; font-size: 16px; }
.todaybtn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 600 14px var(--f-body); height: 44px; padding: 0 14px; flex: none; }

main { padding-block: 14px 190px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 18px 2px 8px; font: 600 12px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sect-h:first-child { margin-top: 2px; }
.sect-h button { border: 0; background: none; color: var(--accent); font: 600 13px var(--f-body); letter-spacing: 0; text-transform: none; padding: 6px 2px; }

/* Filas de ejercicio */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto 36px; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.ro { grid-template-columns: 36px minmax(0, 1fr) auto; padding-right: 14px; }
.fig { width: 48px; height: 56px; color: var(--ink); }
.ro .fig { width: 36px; height: 42px; }
.fig-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fig-svg .body { fill: none; stroke: var(--ink); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.fig-svg .head { fill: var(--ink); }
.fig-svg .plate { fill: var(--accent); }
.fig-svg .floor { stroke: var(--line); stroke-width: 1.5; }
.fig-svg .bar { stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
.fig-svg .benchr { fill: var(--line); }
.fig-svg .rope { fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; }
.nm { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nm b { font: 600 17px/1.15 var(--f-body); overflow-wrap: anywhere; }
.sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 20px; font-size: 13px; color: var(--muted); }
button.last { border: 0; background: none; padding: 3px 0; font: 500 13px var(--f-body); color: var(--muted); text-decoration: underline dotted; text-underline-offset: 3px; text-align: left; }
.kg { position: relative; width: 88px; }
.kg.wide { width: 108px; }
.kg.wide input { padding-right: 42px; }
.kg input { width: 100%; height: 48px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); text-align: right; padding: 0 30px 0 8px; font: 600 24px var(--f-display); font-variant-numeric: tabular-nums; }
.kg input:focus { border-color: var(--accent); background: var(--surface); }
.kg span { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 500 12px var(--f-body); color: var(--muted); pointer-events: none; }
.x { width: 36px; height: 44px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; border-radius: 10px; }
.x svg { width: 18px; height: 18px; }
.kgv { font: 600 22px var(--f-display); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.kgv small { font: 500 12px var(--f-body); color: var(--muted); margin-left: 2px; }
.kgv.none { color: var(--muted); }
.ends { display: flex; gap: 14px; align-items: flex-start; justify-content: flex-end; }
.uv { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
#rows { position: relative; }
.calnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0 8px; }
.calnav b { font: 700 24px var(--f-display); }
.calnav .btn { width: 52px; padding: 0; font-size: 26px; }
.calhead, .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.calhead span { font: 600 12px var(--f-body); color: var(--muted); padding: 6px 0; }
.cald { position: relative; height: 46px; border: 0; border-radius: 12px; background: none; font: 500 18px var(--f-body); color: var(--ink); }
.cald.tr { color: var(--accent); font-weight: 700; }
.cald.td::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: currentColor; }
.cald.sel { background: var(--chip); box-shadow: inset 0 0 0 2px var(--ink); }
.callegend { margin: 10px 0 12px; }
.callegend b { color: var(--accent); font-weight: 700; margin-right: 4px; }
.row.press { transform: scale(1.015); background: var(--chip); transition: transform .12s; }
.row.grp { box-shadow: inset 3px 0 0 var(--accent); }
.row.sel { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); box-shadow: inset 0 0 0 2px var(--accent); }
.row.grp.sel { box-shadow: inset 0 0 0 2px var(--accent), inset 5px 0 0 var(--accent); }
.row.drag.grp, .row.drag.sel { box-shadow: 0 10px 28px rgba(0,0,0,.28); }
.selcancel { flex: none; padding: 0 20px; min-height: 56px; border: 0; border-radius: 16px; background: var(--ink); color: var(--bg); font: 600 16px var(--f-body); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.figbtn { position: relative; border: 0; background: none; padding: 0; border-radius: 10px; color: inherit; }
.figbtn .pen { position: absolute; right: -8px; bottom: -4px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.figbtn .pen svg { width: 11px; height: 11px; }
.igrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 0 14px; }
.icell { border: 1.5px solid var(--line); border-radius: 14px; background: none; padding: 8px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--ink); font: 500 12px/1.2 var(--f-body); text-align: center; min-height: 104px; }
.icell .fig { width: 48px; height: 56px; }
.icell[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 10px 0 4px; }
.stepper .btn { width: 68px; min-height: 60px; font-size: 30px; }
.rnum { text-align: center; min-width: 90px; }
.rnum b { display: block; font: 700 56px/1 var(--f-display); }
.rnum span { color: var(--muted); font-size: 13px; }
.row { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.row input { -webkit-user-select: text; user-select: text; }
.acts { display: flex; flex-direction: column; gap: 2px; }
.acts .x { height: 31px; }
.x.dup { color: var(--accent); }
.ser { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); font: 600 11px/1.5 var(--f-body); letter-spacing: .02em; vertical-align: 2px; }
.row.drag { position: relative; z-index: 6; background: var(--surface); box-shadow: 0 10px 28px rgba(0,0,0,.28); border-radius: 14px; border-bottom-color: transparent; will-change: transform; }
body.dragging { cursor: grabbing; }
.row.fresh { animation: fresh .9s ease-out; }
@keyframes fresh { from { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .row.fresh { animation: none; } }
.row.multi { grid-template-columns: 48px minmax(0, 1fr) 36px; }
.row.multi .kgs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 10px; }
.kcell { flex: 1 1 130px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row.multi .kg, .row.multi .kg.wide { width: 100%; }
.rmline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font: 500 14px var(--f-body); color: var(--muted); }
.rmline:empty { display: none; }
.rmline b { color: var(--ink); font-weight: 700; }
.weak { font-size: 12px; color: var(--muted); font-weight: 500; }
.rmtag { color: var(--accent); font-weight: 700; }
.rmsub { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.srow .hid { margin: 6px 0 0; }
.end { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }

/* Flechas */
.trend { display: inline-flex; align-items: center; gap: 4px; font: 600 14px/1 var(--f-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.trend svg { width: 11px; height: 11px; fill: currentColor; }
.trend.up { color: var(--up); }
.trend.down { color: var(--down); }
.trend.flat, .trend.new { color: var(--flat); font-weight: 500; font-family: var(--f-body); font-size: 12px; }

/* Vacíos */
.empty { padding: 28px 20px; text-align: center; color: var(--muted); }
.empty .fig { margin: 0 auto 6px; width: 64px; height: 76px; }
.empty h2 { margin: 0 0 4px; font: 700 22px var(--f-display); color: var(--ink); }
.empty p { margin: 0 auto 14px; max-width: 32ch; font-size: 15px; }
.btn { border: 0; border-radius: 12px; min-height: 44px; padding: 0 16px; background: var(--chip); font: 600 15px var(--f-body); }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.dng { background: var(--down); color: #fff; }

/* Fotos */
.photos { display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.photo { position: relative; flex: none; width: 96px; height: 96px; border-radius: 12px; overflow: hidden; background: var(--chip); border: 1px solid var(--line); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .open { position: absolute; inset: 0; border: 0; background: none; padding: 0; }
.photo .st { position: absolute; left: 4px; bottom: 4px; max-width: calc(100% - 8px); padding: 2px 6px; border-radius: 6px; background: var(--scrim); color: #fff; font: 600 11px var(--f-body); }
.photo .del { position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--scrim); color: #fff; display: grid; place-items: center; padding: 0; }
.photo .del svg { width: 14px; height: 14px; }
.photo .del.arm { width: auto; border-radius: 8px; padding: 0 8px; background: var(--down); font: 600 12px var(--f-body); }
.addphoto { flex: none; width: 96px; height: 96px; border-radius: 12px; border: 1.5px dashed var(--line); background: none; color: var(--muted); display: grid; place-items: center; align-content: center; gap: 2px; font: 500 12px var(--f-body); }
.addphoto svg { width: 24px; height: 24px; }

/* Barras fijas */
.actions { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 15; padding-block: 10px; display: flex; gap: 10px; background: linear-gradient(to top, var(--bg) 62%, transparent); }
.fab { flex: 1; min-height: 56px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font: 700 20px var(--f-display); letter-spacing: .03em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.fab svg { width: 24px; height: 24px; }
.cam { width: 64px; min-height: 56px; border: 0; border-radius: 16px; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.cam svg { width: 28px; height: 28px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 16; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { height: 60px; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 11px var(--f-body); letter-spacing: 0; white-space: nowrap; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="true"] { color: var(--accent); }

/* Hoja para añadir */
.back { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88%; display: flex; flex-direction: column; background: var(--surface); border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-h { display: flex; align-items: center; gap: 10px; padding-top: 14px; padding-bottom: 8px; }
.sheet-h h2 { flex: 1; margin: 0; font: 700 26px var(--f-display); }
.search { width: 100%; height: 46px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); padding: 0 14px; font: 400 16px var(--f-body); }
.sheet-h, .sheet > .gutter { flex: none; }
.chips { flex: none; display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: var(--chip); font: 600 14px var(--f-body); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sheet-list { overflow-y: auto; flex: 1; border-top: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.pick { width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) 40px; align-items: center; gap: 12px; padding: 6px 0; min-height: 58px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.pick .fig { width: 36px; height: 42px; }
.pick .nm b { font-size: 17px; }
.pick .nm span { font-size: 12.5px; color: var(--muted); }
.plus { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); }
.plus svg { width: 20px; height: 20px; }
.pick.on .plus { background: var(--up); color: #fff; }

/* Historial */
.mh { margin: 18px 2px 8px; font: 700 20px var(--f-display); letter-spacing: .02em; }
.mh:first-child { margin-top: 2px; }
.day { margin-bottom: 12px; }
.day-h { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.day-h b { font: 700 20px var(--f-display); letter-spacing: .01em; }
.day-h .meta { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.day-h .cnt { display: flex; gap: 8px; }
.ranges { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.demo { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; background: var(--chip); font-size: 14px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.note { font-size: 13px; color: var(--muted); margin: 6px 2px 0; }

/* Ejercicios */
.exrow { width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 14px 8px 12px; min-height: 62px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.exrow:last-child { border-bottom: 0; }
.exrow .fig { width: 36px; height: 42px; }
.back-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); font: 600 15px var(--f-body); padding: 8px 0; min-height: 44px; }
.back-btn svg { width: 18px; height: 18px; }
.srow { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow-h { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.srow .fig { width: 36px; height: 42px; }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.seg button { min-height: 42px; border: 0; border-radius: 10px; background: var(--chip); font: 600 15px var(--f-body); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.redraw { padding: 0 14px 14px; }
.redraw .btn { width: 100%; }
.hero { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; }
.hero .fig { width: 72px; height: 86px; }
.hero h2 { margin: 0; font: 700 30px/1.05 var(--f-display); overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.stat { padding: 10px 14px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat small { display: block; font: 600 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat b { font: 700 26px var(--f-display); font-variant-numeric: tabular-nums; }
.stat b i { font: 500 12px var(--f-body); font-style: normal; color: var(--muted); margin-left: 2px; }
.spark { width: 100%; height: auto; display: block; padding: 8px 10px 4px; }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.spark .ar { fill: var(--accent); opacity: .12; stroke: none; }
.spark .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.spark .pt.last { fill: var(--accent); }
.spark .ax { stroke: var(--line); stroke-width: 1; }
.spark text { fill: var(--muted); font: 500 10px var(--f-body); }
.hist-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.hist-row:last-child { border-bottom: 0; }
.hist-row .d { font-weight: 500; }
.pr { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font: 700 11px var(--f-body); letter-spacing: .05em; vertical-align: 2px; }

/* Visor de foto y avisos */
.viewer { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.viewer-bar { display: flex; flex-wrap: wrap; gap: 10px; padding-block: 12px; }

.hbtns { display: flex; gap: 16px; }

.steps { margin: 0 0 10px; padding-left: 20px; font-size: 14px; color: var(--muted); }
.pasteopts { display: flex; gap: 10px; padding-block: 10px; }
.pasteopts .btn { flex: 1; }
.pastebar { padding-block: 10px; border-top: 1px solid var(--line); }
.pastebar .btn { width: 100%; min-height: 52px; font-size: 17px; }

<body>

<header class="top">
  <div class="top-in gutter">
    <h1 id="title"></h1>
    <button class="todaybtn" id="todayBtn" hidden>Hoy</button>
    <button class="ib" id="dateBtn" aria-label="Cambiar la fecha del registro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
  </div>
</header>

<main class="gutter" id="view"></main>

<div class="actions gutter" id="actions">
  <button class="fab" id="addBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Ejercicio
  </button>
</div>
<div class="actions gutter" id="selBar" hidden>
  <button class="selcancel" id="selCancel">Cancelar</button>
  <button class="fab" id="selRound"><span id="selTxt">Hacer ronda</span></button>
</div>

<nav class="tabs" aria-label="Secciones"><div class="tabs-in" id="tabs">
  <button class="tab" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5v5M5.5 7v10M18.5 7v10M21.5 9.5v5M5.5 12h13"/></svg>Hoy</button>
  <button class="tab" data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Entrenamientos</button>
  <button class="tab" data-tab="ejs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Ejercicios</button>
  <button class="tab" data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Setup</button>
</div></nav>

<div class="back" id="sheetBack" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Añadir ejercicio">
    <div class="sheet-h gutter"><h2>Añadir ejercicio</h2><button class="btn pri" id="sheetDone">Listo</button></div>
    <div class="gutter"><input class="search" id="q" type="search" placeholder="Buscar: squat, clean, DL…" autocomplete="off" autocapitalize="off" enterkeyhint="search"></div>
    <div class="chips gutter" id="chips"></div>
    <div class="sheet-list gutter" id="pickList"></div>
  </section>
</div>

<div class="viewer" id="viewer" hidden>
  <img id="viewerImg" alt="Foto del registro">
  <div class="viewer-bar gutter">
    <button class="btn" id="vPaste">Pegar texto</button>
    <button class="btn" id="vRead">Leer foto</button>
    <button class="btn" id="vDel">Eliminar</button>
    <button class="btn pri" id="vClose">Cerrar</button>
  </div>
</div>

<div class="back" id="pasteBack" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Pegar texto de la foto">
    <div class="sheet-h gutter"><h2>Pegar texto</h2><button class="btn" id="pasteClose">Cerrar</button></div>
    <div class="gutter">
      <ol class="steps"><li>Abre la foto y mantén pulsado sobre el texto.</li><li>Toca Copiar.</li><li>Pégalo aquí.</li></ol>
      <textarea id="pasteText" class="search ta" rows="4" placeholder="Pega aquí el texto de la pizarra" autocapitalize="off" autocomplete="off"></textarea>
      <div class="pasteopts"><button class="btn" id="pasteClip">Pegar del portapapeles</button></div>
    </div>
    <div class="sheet-list gutter" id="pasteRes"></div>
    <div class="pastebar gutter"><button class="btn pri" id="pasteAdd" disabled>Añadir</button></div>
  </section>
</div>

<div class="back" id="calBack" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Elegir fecha">
    <div class="sheet-h gutter"><h2>Elegir fecha</h2><button class="btn" id="calClose">Cerrar</button></div>
    <div class="gutter">
      <div class="calnav"><button class="btn" id="calPrev" aria-label="Mes anterior">‹</button><b id="calTitle"></b><button class="btn" id="calNext" aria-label="Mes siguiente">›</button></div>
      <div class="calhead" aria-hidden="true"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="calgrid" id="calGrid"></div>
      <p class="note callegend"><b>12</b> Días con entrenamiento</p>
    </div>
    <div class="pastebar gutter"><button class="btn" id="calToday">Ir a hoy</button></div>
  </section>
</div>

<div class="back" id="iconBack" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Elegir icono">
    <div class="sheet-h gutter"><h2>Elegir icono</h2><button class="btn" id="iconClose">Cerrar</button></div>
    <div class="gutter"><p class="note" id="iconSub"></p></div>
    <div class="sheet-list gutter" id="iconGrid"></div>
    <div class="pastebar gutter"><button class="btn" id="iconReset">Volver al icono original</button></div>
  </section>
</div>

<div class="back" id="roundBack" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-label="Hacer ronda">
    <div class="sheet-h gutter"><h2>Hacer ronda</h2><button class="btn" id="roundClose">Cerrar</button></div>
    <div class="gutter">
      <p class="note" id="roundList"></p>
      <div class="stepper"><button class="btn" id="rMinus" aria-label="Menos rondas">−</button><div class="rnum"><b id="rNum">3</b><span>rondas</span></div><button class="btn" id="rPlus" aria-label="Más rondas">+</button></div>
      <p class="note" id="roundSum" style="text-align:center"></p>
    </div>
    <div class="pastebar gutter"><button class="btn pri" id="roundGo">Crear ronda</button></div>
  </section>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galInput" accept="image/*" hidden>
<input type="file" id="restoreInput" accept="application/json,.json" hidden>

function index() {

    if (v == null) continue;

    idx.get(key).push({date: d, kg: v});
  }
  for (const [d, day] of Object.entries(S.days)) for (const e of day.entries) {
    const v = e.vals || {}, rm = e1rm(v.kg, v.reps); if (rm == null) continue;
    const key = e.ex + "|rm"; if (!idx.has(key)) idx.set(key, []);
    idx.get(key).push({date: d, kg: rm, weak: v.reps > 12});
  }
  for (const [key, r] of [...idx]) {
    r.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    const out = []; for (const x of r) { const l = out[out.length - 1]; if (l && l.date === x.date) { if (x.kg > l.kg) { l.kg = x.kg; l.weak = x.weak; } } else out.push({date: x.date, kg: x.kg, weak: x.weak}); }

}
function trendHtml(t) {

}
const dayOf = (d, create) => S.days[d] || (create ? (S.days[d] = {entries: [], photos: []}) : null);

}

/* ---------- Fotos (IndexedDB, con copia en memoria si no hay) ---------- */
const PH = {
  db: null, mem: new Map(),
  open() {
    return this.db || (this.db = new Promise((res, rej) => {
      const r = indexedDB.open("cf-photos", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("p", {keyPath: "id"});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction("p", mode), rq = fn(t.objectStore("p")); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); });
  },
  async put(rec) { try { await this.run("readwrite", s => s.put(rec)); } catch (e) { this.mem.set(rec.id, rec); } },
  async get(id) { if (this.mem.has(id)) return this.mem.get(id); try { return await this.run("readonly", s => s.get(id)); } catch (e) { return null; } },
  async del(id) { this.mem.delete(id); try { await this.run("readwrite", s => s.delete(id)); } catch (e) {} },
};
async function shrink(file, max = 1600) {
  const bmp = await createImageBitmap(file, {imageOrientation: "from-image"}).catch(() => createImageBitmap(file));
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", 0.85);
}
function dataToBlob(url) {
  const [h, b] = url.split(","), mime = h.match(/:(.*?);/)[1], bin = atob(b), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], {type: mime});
}

  if (!keys.length) {

/* Ejercicios */
function spark(rs) {
  const W = 300, H = 90, px = 28, py = 12, vals = rs.map(r => r.kg);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (lo === hi) { lo -= 1; hi += 1; }
  const X = i => rs.length === 1 ? W / 2 : px + i * (W - px - 10) / (rs.length - 1), Y = v => py + (hi - v) * (H - 2 * py) / (hi - lo);
  const pts = rs.map((r, i) => [X(i), Y(r.kg)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + r1(p[0]) + " " + r1(p[1])).join(" ");
  const area = rs.length > 1 ? `${line} L${r1(pts[pts.length-1][0])} ${H - py} L${r1(pts[0][0])} ${H - py}Z` : "";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso"><line class="ax" x1="${px}" x2="${W-6}" y1="${H-py}" y2="${H-py}"/>
  <text x="2" y="${r1(Y(hi)) + 3}">${fmtKg(Math.max(...vals))}</text><text x="2" y="${r1(Y(Math.min(...vals))) + 3}">${fmtKg(Math.min(...vals))}</text>
  ${area ? `<path class="ar" d="${area}"/>` : ""}<path class="ln" d="${line}"/>${pts.map((p, i) => `<circle class="pt${i === pts.length - 1 ? " last" : ""}" cx="${r1(p[0])}" cy="${r1(p[1])}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`).join("")}
  <text x="${px}" y="${H - 1}">${esc(fmtShort(rs[0].date))}</text><text x="${W - 6}" y="${H - 1}" text-anchor="end">${esc(fmtShort(rs[rs.length - 1].date))}</text></svg>`;
}

    let prSeen = false;

const DRAG = {st: null, t: null};
document.addEventListener("touchmove", e => { if (DRAG.st && (DRAG.st.armed || DRAG.st.on)) e.preventDefault(); }, {passive: false});

function dragCancel() { const st = DRAG.st; if (st && st.row) st.row.classList.remove("press"); clearTimeout(DRAG.t); DRAG.t = null; DRAG.st = null; }
function dragStep() {
  const st = DRAG.st; if (!st || !st.on) return;

  if (st.y < topZ) scrollBy(0, -Math.ceil((topZ - st.y) / 5)); else if (st.y > botZ) scrollBy(0, Math.ceil((st.y - botZ) / 5));
  const want = st.y - st.grab - ul.getBoundingClientRect().top, h = row.offsetHeight;
  let prev = row.previousElementSibling, next = row.nextElementSibling;
  while (prev && want + h / 2 < prev.offsetTop + prev.offsetHeight / 2) { ul.insertBefore(row, prev); prev = row.previousElementSibling; }
  while (next && want + h / 2 > next.offsetTop + next.offsetHeight / 2) { ul.insertBefore(next, row); next = row.nextElementSibling; }
  row.style.transform = `translateY(${want - row.offsetTop}px) scale(1.02)`;
  st.raf = requestAnimationFrame(dragStep);
}

  try { st.row.setPointerCapture(st.id); } catch (e) {}

}

}

  st.row.classList.remove("drag"); st.row.style.transform = ""; document.body.classList.remove("dragging");

    cur = date; busy.delete(pid); ocrRunning = false; openPaste(); $("#pasteBack .sheet-h h2").textContent = "Texto leído de la foto"; $("#pasteText").value = text; parsePaste();
  } catch (e) {
    toast(navigator.onLine ? "No se pudo leer la foto. Prueba con Pegar texto." : "Sin conexión: la primera vez el lector necesita internet. Prueba con Pegar texto.");
  } finally { busy.delete(pid); ocrRunning = false; if (tab === "hoy") render(); }
}
function warmOcr() {
  try {
    if (!navigator.onLine || localStorage.getItem("cf.ocr1")) return;
    const simd = WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]));
    const files = ["tesseract.min.js", "worker.min.js", simd ? "tesseract-core-simd-lstm.wasm.js" : "tesseract-core-lstm.wasm.js", "lang/spa.traineddata.gz", "lang/eng.traineddata.gz"];
    Promise.all(files.map(f => fetch(ocrUrl(f)).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }))).then(() => { try { localStorage.setItem("cf.ocr1", "1"); } catch (e) {} }).catch(() => {});
  } catch (e) {}
}
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").then(() => setTimeout(warmOcr, 3000)).catch(() => {});
}

/* ---------- Arranque ---------- */
render();
checkRead();
</script>
